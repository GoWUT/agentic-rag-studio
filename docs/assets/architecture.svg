<text x="44" y="103" font-size="36" font-weight="700" fill="#14253d">Agentic RAG Studio</text>
<text x="44" y="133" font-size="18" font-weight="400" fill="#52647b">Evidence-grounded research · durable execution · live workspace authority</text>
