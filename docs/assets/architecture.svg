<text x="358" y="306" font-size="17" font-weight="400" fill="#52647b">Private sessions · asset access · durable task control</text>
<text x="358" y="335" font-size="16" font-weight="400" fill="#52647b">Argon2id · rotating refresh · membership &amp; audit</text>
<rect x="936" y="177" width="300" height="179" rx="16" fill="#eef5ff" stroke="#bfcef0"/>
<text x="958" y="209" font-size="12" font-weight="700" fill="#2563eb">03  DURABLE STATE</text>
