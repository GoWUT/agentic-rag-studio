<text x="958" y="895" font-size="14" font-weight="400" fill="#52647b">Grafana configuration included</text>
<text x="44" y="950" font-size="15" font-weight="400" fill="#52647b">Shown: PostgreSQL worker mode. Local alternative: SQLite + inline execution.</text>
