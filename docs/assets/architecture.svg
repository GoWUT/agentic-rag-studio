<text x="66" y="845" font-size="16" font-weight="400" fill="#52647b">Dense + BM25 · RRF · optional reranker</text>
<text x="66" y="873" font-size="16" font-weight="400" fill="#52647b">PDF / OCR · Chroma · page citations</text>
<text x="66" y="895" font-size="14" font-weight="400" fill="#52647b">Shared files: datasets · artifacts · model cache</text>
<rect x="484" y="744" width="408" height="165" rx="16" fill="#ffffff" stroke="#d9e2ef"/>
<text x="506" y="776" font-size="12" font-weight="700" fill="#087f8c">07  GOVERNED ACTIONS</text>
<text x="506" y="813" font-size="21" font-weight="700" fill="#14253d">Analysis + MCP tools</text>
<text x="506" y="845" font-size="16" font-weight="400" fill="#52647b">MCP writes: RBAC → policy → approval</text>
<text x="506" y="873" font-size="16" font-weight="400" fill="#52647b">Recheck authority → claim → receipt</text>
<text x="506" y="895" font-size="14" font-weight="400" fill="#52647b">Constrained subprocess; not an OS sandbox</text>
<rect x="936" y="744" width="300" height="165" rx="16" fill="#eff8f7" stroke="#c6e3de"/>
<text x="958" y="776" font-size="12" font-weight="700" fill="#087f8c">08  OPTIONAL TELEMETRY</text>
