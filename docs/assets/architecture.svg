<rect x="44" y="744" width="408" height="165" rx="16" fill="#ffffff" stroke="#d9e2ef"/>
<text x="66" y="776" font-size="12" font-weight="700" fill="#087f8c">06  RESEARCH &amp; SHARED FILES</text>
