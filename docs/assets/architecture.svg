<text x="64" y="335" font-size="15" font-weight="400" fill="#52647b">Session-local auth tokens</text>
<rect x="336" y="177" width="556" height="179" rx="16" fill="#ffffff" stroke="#d9e2ef"/>
<text x="358" y="209" font-size="12" font-weight="700" fill="#2563eb">02  API &amp; AUTHORITY</text>
