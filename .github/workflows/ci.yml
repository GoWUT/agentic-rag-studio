name: source-checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions: {contents: read}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.12.21", python-version: "3.11"}
      - run: uv lock --check
      - run: python -m compileall -q server client scripts evaluation alembic
      - run: git diff --check
      - name: Keep local test files out of the repository
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          tests = [p for p in paths if PurePosixPath(p).name.startswith('test_')
                   or PurePosixPath(p).name.endswith('_test.py')
                   or 'tests' in PurePosixPath(p).parts]
          if tests:
              raise SystemExit('Local test files must not be tracked: ' + ', '.join(tests))
          PY
