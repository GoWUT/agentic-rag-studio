[project]
name = "agentic-rag-studio"
version = "0.1.0"
description = "Persistent multi-tool Agentic RAG workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "langgraph-checkpoint-sqlite==3.0.3",
    "jsonschema>=4.25,<5",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1,<4",
    "arxiv>=2.3.1",
    "chromadb>=1.3.7",
    "datasets>=4.4.1",
    "fastapi>=0.124.4",
    "langchain>=1.1.3",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.1",
    "langchain-huggingface>=1.2.0",
    "langchain-openai>=1.1.0",
    "langchain-tavily>=0.2.14",
    "langchain-text-splitters>=1.1.0",
    "langgraph==1.0.5",
    "langsmith>=0.4.59",
    "pypdf>=6.4.2",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "requests>=2.32.0",
    "ragas>=0.4.1",
    "sentence-transformers>=5.2.0",
    "streamlit>=1.52.1",
    "uvicorn>=0.38.0",
    "sqlalchemy==2.0.45",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.16,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "procrastinate==3.10.0",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b0,<1",
    "prometheus-client>=0.22,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
ocr = [
    "chardet>=3.0.2,<6",  # requests 2.32 compatibility for PaddleX downloads
    "paddleocr>=3.4.0,<4",
    "paddlepaddle>=3.2.0,<4",
    "pypdfium2>=4.30.0,<6",
]
